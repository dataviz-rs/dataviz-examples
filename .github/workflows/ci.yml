name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch breakage from new dataviz releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (minifb)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Use the latest dataviz release
        run: cargo update -p dataviz
      - name: Build every example
        run: cargo build --workspace
      - name: Run every example (the interactive one only renders its PNG)
        run: |
          mkdir -p out && cd out
          for dir in ../plot-*; do
            bin=$(basename $dir)
            echo "::group::$bin"
            if [ "$bin" = plot-wasm ]; then
              echo "WebAssembly library: built for wasm32 below"
            elif [ "$bin" = plot-binance ]; then
              echo "needs network access to Binance: built only"
            elif [ "$bin" = plot-interactive ]; then
              timeout 10 ../target/debug/$bin > /dev/null || true
              test -s interactive.png
            elif [ "$bin" = plot-backends ]; then
              ../target/debug/$bin 3
            elif [ "$bin" = plot-streaming ]; then
              ../target/debug/$bin sim --record streaming.gif --seconds 2
              test -s streaming.gif
            else
              ../target/debug/$bin > /dev/null
            fi
            echo "::endgroup::"
          done
          ls -l
      - name: Build the WebAssembly example
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --profile wasm --target wasm32-unknown-unknown -p plot-wasm
          ls -l target/wasm32-unknown-unknown/wasm/plot_wasm.wasm
