[workspace]
resolver = "2"
members = [
    "plot-accessibility",
    "plot-animation",
    "plot-annotations",
    "plot-area-fill",
    "plot-backends",
    "plot-bars",
    "plot-binance",
    "plot-box-violin",
    "plot-broken-axis",
    "plot-candlestick",
    "plot-contour",
    "plot-distributions",
    "plot-egui",
    "plot-errorbars-band",
    "plot-facets",
    "plot-formats",
    "plot-funnel-gauge",
    "plot-gantt",
    "plot-heatmap",
    "plot-hist2d-hexbin",
    "plot-histograms",
    "plot-image",
    "plot-html",
    "plot-indicators",
    "plot-interactive",
    "plot-international",
    "plot-line",
    "plot-log-scales",
    "plot-maps",
    "plot-markers-steps-smooth",
    "plot-math",
    "plot-network",
    "plot-parallel-calendar",
    "plot-pie-donut",
    "plot-polar-radar",
    "plot-quiver-function",
    "plot-sankey",
    "plot-scatter-bubble",
    "plot-stacked-area",
    "plot-stem-waterfall",
    "plot-streaming",
    "plot-subplots-shared",
    "plot-terminal",
    "plot-themes",
    "plot-three-d",
    "plot-time-series",
    "plot-treemap-sunburst",
    "plot-wasm",
]


# Small WebAssembly builds: `cargo build --profile wasm --target wasm32-unknown-unknown -p plot-wasm`.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
